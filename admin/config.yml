backend:
  name: git-gateway
  repo: danniskhaq-ui/Web-portofolio
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/923cb57f-b59f-4e57-ac39-ea778718ca38/pkce
  auth_token_endpoint: /sites/923cb57f-b59f-4e57-ac39-ea778718ca38/token
  gateway_url: https://gateway.decapbridge.com

# Lokasi penyimpanan gambar yang diunggah dari CMS
media_folder: "images/uploads"
public_folder: "/images/uploads"

# Pengaturan struktur blog Anda
collections:
  - name: "blog"
    label: "Blog"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Judul", name: "title", widget: "string" }
      - { label: "Kategori", name: "category", widget: "string" }
      - { label: "Tanggal", name: "date", widget: "datetime" }
      - { label: "Gambar Utama", name: "thumbnail", widget: "image" }
      - { label: "Ringkasan", name: "description", widget: "text" }
      - { label: "Isi Artikel", name: "body", widget: "markdown" }

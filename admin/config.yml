backend:
  name: github
  repo: username-github-mu/nama-repo-mu # Ganti dengan username & nama repo Anda
  branch: main # Ganti jika nama branch utama Anda bukan main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "blog"
    label: "Blog"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Judul", name: "title", widget: "string" }
      - { label: "Tanggal", name: "date", widget: "datetime" }
      - { label: "Isi Artikel", name: "body", widget: "markdown" }

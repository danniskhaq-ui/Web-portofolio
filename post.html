<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Detail Artikel</title>
  <link rel="stylesheet" href="style.css"> <!-- Sesuaikan dengan file CSS Anda -->
</head>
<body>
  <main class="bkm-container" style="padding: 40px 20px; max-width: 800px; margin: auto;">
    <a href="blog.html" style="text-decoration:none;">&larr; Kembali ke Blog</a>
    <article id="post-content" style="margin-top: 20px;">
      <p>Memuat artikel...</p>
    </article>
  </main>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  async function loadSinglePost() {
    const urlParams = new URLSearchParams(window.location.search);
    const fileName = urlParams.get('file');
    const container = document.getElementById("post-content");

    if (!fileName) {
      container.innerHTML = "<h2>Artikel tidak ditemukan.</h2>";
      return;
    }

    const repo = "danniskhaq-ui/Web-portofolio";
    const fileUrl = `https://raw.githubusercontent.com/${repo}/main/content/blog/${fileName}`;

    try {
      const res = await fetch(fileUrl);
      const rawText = await res.text();

      const parts = rawText.split("---");
      const metadata = parts[1] || "";
      const markdownBody = parts.slice(2).join("---");

      // Extract metadata dari Frontmatter YAML
      const titleMatch = metadata.match(/title:\s*["']?(.*?)["']?\n/);
      const thumbMatch = metadata.match(/thumbnail:\s*["']?(.*?)["']?\n/);

      const title = titleMatch ? titleMatch[1] : "Artikel Blog";
      const thumbnail = thumbMatch ? thumbMatch[1] : "";

      // Siapkan elemen gambar jika thumbnail ada
      const imageHTML = thumbnail 
        ? `<img src="${thumbnail}" alt="${title}" style="width: 100%; max-height: 400px; object-fit: cover; border-radius: 10px; margin-bottom: 24px;">`
        : "";

      // Render Gambar, Judul, dan Isi Artikel
      container.innerHTML = `
        ${imageHTML}
        <h1 style="margin-bottom: 16px;">${title}</h1>
        <hr style="margin: 20px 0; opacity: 0.2;">
        <div style="line-height: 1.8; font-size: 1.05rem;">
  ${marked.parse(markdownBody)}
        </div>
          ${marked.parse(markdownBody)}
        </div>
      `;
    } catch (err) {
      container.innerHTML = "<h2>Gagal memuat artikel.</h2>";
    }
  }

  loadSinglePost();
</script>
</body>
</html>
